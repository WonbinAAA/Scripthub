<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aun's Upload Web</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--bg:#f4f5f7;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--side:260px;--top:74px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Prompt','Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}.topbar{height:var(--top);background:#fff;border-bottom:1px solid var(--border);padding:15px 30px;display:flex;align-items:center}.content{padding:30px;flex:1}.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;max-width:900px}.title{font-size:20px;font-weight:600;margin-bottom:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:6px;font:13px 'Prompt',sans-serif;outline:none}.field.full{grid-column:1/-1}.btn{margin-top:18px;border:0;border-radius:6px;padding:10px 20px;background:var(--accent);color:#fff;font:13px 'Prompt',sans-serif;cursor:pointer}.btn:disabled{opacity:.6}.status{margin-top:12px;font-size:12px;min-height:20px;color:var(--muted)}@media(max-width:768px){.main{margin-left:0}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="main"><header class="topbar"></header><main class="content"><h1 class="title">🌐 Upload Web</h1><section class="panel"><div class="row"><div class="field"><label for="siteName">ชื่อเว็บไซต์</label><input id="siteName" placeholder="เช่น Google"></div><div class="field"><label for="siteUrl">ลิงก์เว็บไซต์</label><input id="siteUrl" placeholder="https://www.google.com"></div><div class="field full"><label for="siteDesc">คำอธิบาย</label><input id="siteDesc" placeholder="คำอธิบายเว็บไซต์"></div></div><button class="btn" id="addBtn" type="button">＋ เพิ่มเว็บไซต์</button><div class="status" id="status"></div></section></main></div>
<script src="sidebar.js"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbwMqiLiZJxBFXjmB3picJPfPQH1SDFfiL3MDIP44gidOO9pfASOM07B3XZWCrJ1HfOKmQ/exec';
const KEY='aun_script_vault_websites_v2',PENDING_KEY='aun_script_vault_websites_pending_v2';
const addBtn=document.getElementById('addBtn'),status=document.getElementById('status');
function normalize(v){v=String(v||'').trim();return v&&!/^https?:\/\//i.test(v)?'https://'+v:v}
function validUrl(v){try{const u=new URL(v);return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveLocal(x){localStorage.setItem(KEY,JSON.stringify(x))}
function setPending(item){try{const p=JSON.parse(localStorage.getItem(PENDING_KEY)||'{}');p.add={...item,savedAt:Date.now()};localStorage.setItem(PENDING_KEY,JSON.stringify(p))}catch(e){}}
async function api(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return await r.json()}
addBtn.onclick=async()=>{const name=siteName.value.trim(),url=normalize(siteUrl.value),description=siteDesc.value.trim();if(!name||!validUrl(url)){status.textContent='❌ กรุณาระบุชื่อและลิงก์เว็บไซต์ให้ถูกต้อง';return}addBtn.disabled=true;status.textContent='กำลังบันทึก...';try{const r=await api({action:'addWebsiteCard',name,url,description});if(!r.success)throw new Error(r.message||'เพิ่มเว็บไซต์ไม่สำเร็จ');const item={id:'website-'+(r.cardNumber||Date.now()),name,url:r.url||url,description};const sites=loadLocal();sites.push(item);saveLocal(sites);setPending(item);window.AunSharedSidebar?.refreshWebsites();siteName.value='';siteUrl.value='';siteDesc.value='';await Swal.fire({icon:'success',title:'เพิ่มเว็บไซต์สำเร็จ',timer:1600,showConfirmButton:false})}catch(e){status.textContent='❌ '+e.message}finally{addBtn.disabled=false}};
</script>
</body>
</html>
