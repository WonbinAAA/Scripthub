<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aun's Websites</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--hover:#1d4ed8;--side:260px;--top:74px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Prompt','Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}.sidebar{width:var(--side);background:#fff;position:fixed;inset:0 auto 0 0;z-index:100;transition:transform .3s}.sidebar.collapsed{transform:translateX(-100%)}.sidebar-header{height:var(--top);padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.header-left{display:flex;align-items:center;gap:12px}.sidebar-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}.sidebar-title{font-size:15px;font-weight:600}.sidebar-menu{padding:15px;overflow-y:auto;height:calc(100vh - var(--top))}.menu-label{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px;font-weight:600}.menu-item{display:block;width:100%;padding:9px 12px;color:var(--text);text-decoration:none;border:0;background:transparent;border-radius:6px;font:13px 'Prompt',sans-serif;margin-bottom:4px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu-item:hover,.menu-item.active{background:#eff6ff;color:var(--accent);font-weight:500}.menu-toggle{display:flex;justify-content:space-between;align-items:center}.menu-arrow{transition:transform .2s}.menu-toggle.collapsed .menu-arrow{transform:rotate(-90deg)}.menu-children{overflow:hidden;max-height:5000px;transition:max-height .25s}.menu-children.collapsed{max-height:0}.menu-child{padding-left:20px;font-size:12px}.main{margin-left:var(--side);width:calc(100% - var(--side));min-height:100vh;display:flex;flex-direction:column;border-left:1px solid var(--border);transition:.3s}.sidebar.collapsed~.main{margin-left:0;width:100%}.topbar{height:var(--top);background:#fff;border-bottom:1px solid var(--border);padding:15px 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}.toggle{border:0;background:transparent;padding:8px;border-radius:50%;cursor:pointer;color:var(--muted);display:flex}.top-toggle{display:none}.sidebar.collapsed~.main .top-toggle{display:flex}.search{width:240px;padding:8px 14px;border:1px solid var(--border);border-radius:6px;font:14px 'Prompt',sans-serif;outline:none}.content{padding:30px;flex:1}.header{margin-bottom:20px}.title{font-size:20px;font-weight:600}.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:25px}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;font:13px 'Prompt',sans-serif;outline:none}.btn{border:0;border-radius:6px;padding:9px 16px;background:var(--accent);color:#fff;font:13px 'Prompt',sans-serif;cursor:pointer}.btn:hover{background:var(--hover)}.btn:disabled{opacity:.6;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:180px;box-shadow:0 1px 3px rgba(0,0,0,.02);transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.05)}.file-title{font-size:15px;font-weight:600;margin-bottom:8px}.file-desc{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.4}.file-meta{font:11px monospace;background:#f3f4f6;padding:3px 6px;border-radius:4px;display:inline-block;margin-bottom:14px;color:#4b5563}.actions{display:flex;gap:8px}.open{flex:1;text-align:center;text-decoration:none;background:var(--accent);color:#fff;padding:8px;border-radius:6px;font-size:13px}.icon{width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer}.icon:hover{background:#f3f4f6}.delete:hover{color:#dc2626;background:#fef2f2;border-color:#fecaca}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal.show{display:flex}.modal-box{width:min(520px,100%);background:#fff;border-radius:10px;padding:22px}.modal h2{font-size:17px;margin-bottom:18px}.modal-field{margin-bottom:14px}.modal-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.modal-field input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font:13px 'Prompt',sans-serif}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cancel{background:#f3f4f6;color:var(--text)}.status{font-size:12px;color:var(--muted);min-height:18px}.no-result{text-align:center;color:var(--muted);padding:40px;display:none;grid-column:1/-1}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.mobile-show{transform:translateX(0)}.main{margin-left:0;width:100%}.top-toggle{display:flex!important}}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="header-left"><img src="Images/AAA.jpg" class="sidebar-avatar" alt="Aun's Scripts"><div class="sidebar-title">Aun's Scripts</div></div><button class="toggle" id="sideToggle" title="ยุบ/ขยายเมนู">☰</button></div><div class="sidebar-menu" id="sidebarMenu"><div class="menu-label">Menu</div><a class="menu-item" href="index.html#upload">⬆️ Upload Script</a><div class="menu-label" style="margin-top:18px">Scripts List</div><div class="menu-children" id="scriptMenu"></div><button class="menu-item menu-toggle active" id="websiteToggle" type="button"><span>🌐 เว็บไซต์</span><span class="menu-arrow">▼</span></button><div class="menu-children" id="websiteMenu"><span class="menu-item menu-child">กำลังโหลด...</span></div></div></aside>
<div class="main"><header class="topbar"><button class="toggle top-toggle" id="topToggle">☰</button><input id="search" class="search" placeholder="🔍 ค้นหาเว็บไซต์..."></header><main class="content"><div class="header"><h1 class="title">รายการเว็บไซต์</h1></div><section class="panel"><div class="row"><div class="field"><label>ชื่อเว็บไซต์</label><input id="siteName" placeholder="เช่น Google"></div><div class="field"><label>ลิงก์เว็บไซต์</label><input id="siteUrl" placeholder="https://www.google.com"></div><div class="field"><label>คำอธิบาย</label><input id="siteDesc" placeholder="คำอธิบายเว็บไซต์"></div><button class="btn" id="addBtn">เพิ่มเว็บไซต์</button></div><div class="status" id="status"></div></section><div class="grid" id="websiteGrid"><div class="no-result" id="noResult">ไม่พบเว็บไซต์ที่ค้นหา</div></div></main><footer style="text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#fff">© 2026 สุกฤษฎิ์ กุมภาว์ • พัฒนาด้วย GitHub Pages</footer></div>
<div class="modal" id="editModal"><div class="modal-box"><h2>แก้ไขเว็บไซต์</h2><div class="modal-field"><label>ชื่อเว็บไซต์</label><input id="editName"></div><div class="modal-field"><label>ลิงก์เว็บไซต์</label><input id="editUrl"></div><div class="modal-field"><label>คำอธิบาย</label><input id="editDesc"></div><div class="status" id="editStatus"></div><div class="modal-actions"><button class="btn cancel" id="cancelBtn">ยกเลิก</button><button class="btn" id="saveBtn">บันทึก</button></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwMqiLiZJxBFXjmB3picJPfPQH1SDFfiL3MDIP44gidOO9pfASOM07B3XZWCrJ1HfOKmQ/exec';
const KEY='aun_script_vault_websites_v1';const sidebar=document.getElementById('sidebar');
document.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{if(innerWidth<=768)sidebar.classList.toggle('mobile-show');else sidebar.classList.toggle('collapsed')}));
const websiteGrid=document.getElementById('websiteGrid'),websiteMenu=document.getElementById('websiteMenu'),scriptMenu=document.getElementById('scriptMenu');
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveLocal(x){localStorage.setItem(KEY,JSON.stringify(x))}
function validUrl(v){try{const u=new URL(v.trim());return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}}
function normalize(v){v=String(v||'').trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;return v}
function renderSites(){const sites=loadLocal();websiteGrid.querySelectorAll('.card').forEach(x=>x.remove());sites.forEach((s,i)=>{const c=document.createElement('div');c.className='card';c.id=s.id||'website-'+(i+1);c.dataset.websiteUrl=s.url;c.dataset.name=(s.name+' '+s.description+' '+s.url).toLowerCase();c.innerHTML='<div><div class="file-title"></div><div class="file-desc"></div><span class="file-meta">WEB</span></div><div class="actions"><a class="open" target="_blank" rel="noopener">เปิดเว็บไซต์</a><button class="icon" data-action="edit">✎</button><button class="icon delete" data-action="delete">🗑</button></div>';c.querySelector('.file-title').textContent=s.name;c.querySelector('.file-desc').textContent=s.description||'เว็บไซต์';c.querySelector('.open').href=s.url;websiteGrid.appendChild(c)});renderMenu(sites)}
function renderMenu(sites){websiteMenu.innerHTML='';if(!sites.length){const e=document.createElement('span');e.className='menu-item menu-child';e.textContent='ยังไม่มีเว็บไซต์';websiteMenu.appendChild(e)}else sites.forEach(s=>{const a=document.createElement('a');a.className='menu-item menu-child';a.href='websites.html#'+encodeURIComponent(s.id);a.textContent='🌐 '+s.name;a.title=s.url;websiteMenu.appendChild(a)})}
async function syncFromGitHub(){try{const r=await fetch('websites.html?sync='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const d=new DOMParser().parseFromString(t,'text/html');const out=[];d.querySelectorAll('#websiteGrid .card').forEach(c=>{const name=c.querySelector('.file-title')?.textContent.trim();const desc=c.querySelector('.file-desc')?.textContent.trim();const url=c.dataset.websiteUrl||c.dataset.webUrl||c.querySelector('.open')?.href;if(name&&url)out.push({id:c.id,name,description:desc||'',url})});if(out.length)saveLocal(out);renderSites()}catch(e){renderSites()}}
websiteGrid.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const c=b.closest('.card');const sites=loadLocal();const idx=sites.findIndex(s=>(s.id||'')===c.id||s.url===c.dataset.websiteUrl);if(idx<0)return;if(b.dataset.action==='delete'){const ok=await Swal.fire({icon:'warning',title:'ยืนยันการลบ?',text:sites[idx].name,showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก'});if(!ok.isConfirmed)return;try{const r=await api({action:'deleteWebsiteCard',url:sites[idx].url});if(!r.success)throw new Error(r.message);sites.splice(idx,1);saveLocal(sites);renderSites();await Swal.fire({icon:'success',title:'ลบเว็บไซต์สำเร็จ',timer:1600,showConfirmButton:false})}catch(err){Swal.fire({icon:'error',title:'ลบไม่สำเร็จ',text:err.message})}}else openEdit(sites[idx],idx)});
let editIndex=-1;function openEdit(s,i){editIndex=i;editName.value=s.name;editUrl.value=s.url;editDesc.value=s.description||'';editStatus.textContent='';editModal.classList.add('show')};cancelBtn.onclick=()=>editModal.classList.remove('show');
saveBtn.onclick=async()=>{if(editIndex<0)return;const old=loadLocal()[editIndex],name=editName.value.trim(),url=normalize(editUrl.value),desc=editDesc.value.trim();if(!name||!validUrl(url)){editStatus.textContent='กรุณาตรวจสอบชื่อและลิงก์เว็บไซต์';return}saveBtn.disabled=true;editStatus.textContent='กำลังบันทึก...';try{const r=await api({action:'editWebsiteCard',oldUrl:old.url,name,url,description:desc});if(!r.success)throw new Error(r.message);const sites=loadLocal();sites[editIndex]={...old,name,url:r.url||url,description:desc};saveLocal(sites);renderSites();editModal.classList.remove('show');await Swal.fire({icon:'success',title:'แก้ไขเว็บไซต์สำเร็จ',timer:1600,showConfirmButton:false})}catch(err){editStatus.textContent='❌ '+err.message}finally{saveBtn.disabled=false}};
addBtn.onclick=async()=>{const name=siteName.value.trim(),url=normalize(siteUrl.value),description=siteDesc.value.trim();if(!name||!validUrl(url)){status.textContent='กรุณาระบุชื่อและลิงก์เว็บไซต์ให้ถูกต้อง';return}addBtn.disabled=true;status.textContent='กำลังบันทึก...';try{const r=await api({action:'addWebsiteCard',name,url,description});if(!r.success)throw new Error(r.message);const sites=loadLocal();sites.push({id:'website-'+(r.cardNumber||Date.now()),name,url:r.url||url,description});saveLocal(sites);renderSites();siteName.value='';siteUrl.value='';siteDesc.value='';await Swal.fire({icon:'success',title:'เพิ่มเว็บไซต์สำเร็จ',timer:1600,showConfirmButton:false})}catch(e){status.textContent='❌ '+e.message}finally{addBtn.disabled=false}};
search.oninput=()=>{const q=search.value.toLowerCase().trim();let n=0;websiteGrid.querySelectorAll('.card').forEach(c=>{const ok=!q||(c.dataset.name||'').includes(q);c.style.display=ok?'flex':'none';if(ok)n++});noResult.style.display=n?'none':'block'};
async function api(p){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return await r.json()}
websiteToggle.onclick=()=>{const c=websiteMenu.classList.toggle('collapsed');websiteToggle.classList.toggle('collapsed',c)};
syncFromGitHub();
</script></body></html>
